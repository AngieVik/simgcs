<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulador de Casos Glasgow</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0c111d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="SimuladorGCS" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <script>
      // Script para cargar el tema al instante y evitar FOUC (Flash of Unstyled Content)
      (function () {
        const theme = localStorage.getItem("gcs-theme");
        if (
          theme === "dark" ||
          (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
        ) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Fugaz+One&family=Abril+Fatface&family=IM+Fell+English&family=Lora:ital,wght@0,400..700;1,400..700&family=Luckiest+Guy&family=Special+Elite&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Configuración de Tailwind para habilitar el modo oscuro por clase
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {},
        },
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
